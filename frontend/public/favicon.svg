<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="roseBadgeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="silkCreamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fdf5ee" />
      <stop offset="100%" stop-color="#fbede4" />
    </linearGradient>
    <linearGradient id="whiteChromeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#881337" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Rose Coral Base Tile -->
  <rect width="64" height="64" rx="16" fill="url(#roseBadgeGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#silkCreamGrad)" stroke-width="1.5" stroke-opacity="0.8" />
  
  <!-- Stylized ResQFood Monogram Emblem -->
  <!-- "R" Stroke -->
  <path d="M12 44V20h11c5.5 0 9.5 3.2 9.5 8.2 0 3.8-2.2 6.6-5.8 7.7L33 44h-5.5l-5.6-7.5H17.2V44H12zm5.2-12.2h5.5c2.8 0 4.8-1.5 4.8-3.8 0-2.4-1.9-3.8-4.8-3.8h-5.5v7.6z" fill="url(#silkCreamGrad)" />

  <!-- "Q" Silk Ring with Cloche (Centered on right) -->
  <g transform="translate(39, 32)" filter="url(#roseGlow)">
    <!-- Silk Cream Circular Outer Halo -->
    <circle cx="0" cy="0" r="14.5" stroke="url(#silkCreamGrad)" stroke-width="3" fill="#be123c" fill-opacity="0.6" />
    <line x1="9" y1="9" x2="16.5" y2="16.5" stroke="url(#silkCreamGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Mini Cloche (Serving Dome) inside Q -->
    <path d="M-6.5 2.5h13a1 1 0 0 1 1 1v0.5H-7.5v-0.5a1 1 0 0 1 1-1z" fill="url(#silkCreamGrad)" />
    <path d="M-5.5 2.5a5.5 5.5 0 0 1 11 0z" fill="url(#whiteChromeGrad)" />
    <circle cx="0" cy="-4" r="1.2" fill="url(#silkCreamGrad)" />
    
    <!-- Food Leaf Accent -->
    <path d="M1.5 5c2-1 4.5 0 4.5 2.5s-2.5 2-4.5 1c0-1.5 0-3 0-3.5z" fill="url(#silkCreamGrad)" />
  </g>
</svg>
